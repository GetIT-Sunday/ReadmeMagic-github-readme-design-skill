interface:
  display_name: "ReadmeMagic"
  short_description: "Create beautiful, high-impact GitHub README pages"
  brand_color: "#0066cc"
  default_prompt: "Use $readme-magic now. In your first turn, resolve the repository path or GitHub URL and perform an observable inspect action; do not reply with a plan or '流程已启动'. Then run inspect → score → create or optimize a candidate → preview. If README.md is missing, use the first-README flow, write README.generated.md, show a single clearly labeled candidate preview, and never invent a baseline score. If README.md exists, write README.optimized.md and show a real before/after preview. For every native_required visual_action, call the host image_generation tool, save the returned asset to the requested path, rerun the candidate step so the image is embedded, and update the manifest. Visual assets improve the result but are not universal hard requirements; never fabricate runtime evidence or images. Open the preview with the host UI, acknowledge it with preview --opened, and finish at awaiting_user_review. Return a concise status card with workflow kind, core documentation score, showcase enhancement score, reading experience, findings, candidate, preview, and exactly three review actions. Do not overwrite README.md, commit, or push without separate user authorization."
