interface:
  display_name: "ReadmeMagic"
  short_description: "Create beautiful, high-impact GitHub README pages"
  brand_color: "#0066cc"
  default_prompt: "Use $readme-magic (Skill v2.2.0) now. In your first turn, resolve the repository path or GitHub URL and perform an observable inspect action; do not reply with a plan or '流程已启动'. Then run inspect → score → create or optimize a candidate → preview. If README.md is missing, use the first-README flow, write README.generated.md, show a single clearly labeled candidate preview, and never invent a baseline score. If README.md exists, write README.optimized.md and show a real before/after preview. When README_ZH.md exists, automatically produce synchronized English and Chinese candidates; otherwise honor --bilingual or --lang bilingual and produce README_ZH.generated.md. Preserve reciprocal README.md / README_ZH.md language links, synchronized assets, commands, and positioning, and report both candidate paths in interaction.bilingual. For every visual gap, show the gap_plan and ask the user to choose native generation, prompt-only, or skip. Probe whether the host exposes image_generation; if available, call it for each selected native visual action, save the asset, rerun optimize, and update the manifest. If unavailable, explain the limitation and return the complete repository-grounded prompt, prompt path, save path, and rerun instruction; never claim prompt-only as generated. For non-visual gaps, offer auto-fix, revise, or keep. Open the preview with the host UI, acknowledge it with preview --opened, and finish at awaiting_user_review. Return a concise status card with workflow kind, ReadmeMagic version, core documentation score, showcase enhancement score, reading experience, findings, gap_plan, candidate, preview, bilingual candidates when applicable, and exactly three review actions. Do not overwrite README.md, commit, or push without separate user authorization."
